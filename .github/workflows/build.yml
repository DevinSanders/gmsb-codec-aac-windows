name: Build

# Validates the plugin builds + packages on every push and PR. The
# produced zip is uploaded as a workflow artifact so reviewers can
# install it on a local copy of Game Master Sound Board to smoke-test
# without having to build the plugin themselves.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build + package
    # Windows runner: this plugin's NAudio.Wasapi dependency (the Media
    # Foundation interop) is restored only on Windows (conditional
    # PackageReference), so we need a Windows host to produce a
    # functional zip. The plugin still
    # compiles off-Windows (WINDOWS_BUILD is undefined → MF calls
    # vanish), but the resulting artifact would throw at runtime.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        # NOTE: Use the explicit path, not a glob. The default shell on
        # windows-latest is pwsh, which does NOT expand wildcards for
        # native commands — `dotnet restore src/*.csproj` would pass the
        # literal string `src/*.csproj` to dotnet and fail with MSB1009.
        run: dotnet restore src/AacWindowsCodecPlugin.csproj

      - name: Test
        # Runs on the Windows runner so the Media Foundation decode tests
        # actually exercise the codec (they self-skip off-Windows).
        run: dotnet test tests/AacWindowsCodecPlugin.Tests.csproj -c Release --nologo

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
