name: Release

# Publishes this PAID plugin to itch.io when a `v*` tag is pushed. The repo
# is public for source/reference, but the pre-built binary is sold (or
# pay-what-you-want) via itch — there is NO public GitHub Release, no
# artifact attached to a Release page, no built zip published from this
# repo's Releases tab. Buyers download the zip from itch and drop it onto
# Game Master Sound Board's Plugin Manager.
#
# Trigger: ONLY a pushed `v*` tag fires this workflow. There is no manual
# (workflow_dispatch) trigger by design — cutting a release is a single
# act: `git tag v1.2.3 && git push --tags`. The tag IS the release.
#
# Tag convention: `v<semver>` (e.g. `v1.0.0`, `v1.1.0-beta.1`). Pre-release
# tags (containing `-`) are still pushed to itch the same way; itch
# channels are the right place to express stability, not GitHub releases.
#
# Version flow — the tag is the single source of truth:
#   tag `v1.2.3`
#     → strip the leading `v`   → 1.2.3
#     → package.ps1 -Version 1.2.3
#         • Stamps it into plugin.json (the manifest the host reads).
#         • Forwards `-p:Version=1.2.3` to `dotnet publish`, baking it
#           into AssemblyInformationalVersion (PluginVersion.OfAssembly
#           reads that at runtime).
#         • Uses it in the zip filename: <publisher>-<id>-1.2.3.zip.
#     → butler --userversion 1.2.3 push to itch.
# So whatever plugin.json or the csproj say in source is irrelevant on
# release; the tag wins.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release as (e.g. v1.0.0). Will be created if it does not exist.'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: read   # publishing to itch.io needs no write access to the repo

jobs:
  release:
    name: Build + package + publish
    # Windows runner: NAudio.Wasapi (Media Foundation interop) is a
    # conditional PackageReference that only restores on Windows, and
    # WINDOWS_BUILD is only defined on Windows. Releasing from Linux
    # would ship a zip whose CreateStream throws on every call — even
    # on Windows. Keep this in lockstep with build.yml.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: ver
        shell: bash
        # github.ref_name on a tag-push is the tag itself (e.g. "v1.2.3").
        # Strip the leading `v` to get the SemVer that gets baked into the
        # artifact.
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "Tag:     $TAG"
          echo "Version: $VERSION"

      - name: Restore
        # NOTE: Use the explicit path, not a glob. The default shell on
        # windows-latest is pwsh, which does NOT expand wildcards for
        # native commands — `dotnet restore src/*.csproj` would pass the
        # literal string `src/*.csproj` to dotnet and fail with MSB1009.
        run: dotnet restore src/AacWindowsCodecPlugin.csproj

      - name: Test
        # Same Windows-only invariant as build.yml: the MF decode tests
        # must actually run before we ship the zip.
        run: dotnet test tests/AacWindowsCodecPlugin.Tests.csproj -c Release --nologo

      - name: Package
        shell: pwsh
        # -Version makes the script stamp plugin.json + pass -p:Version=
        # through to dotnet publish, so the manifest and the assembly
        # metadata both reflect the release tag.
        run: ./scripts/package.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Smoke-test the zip's manifest
        # Mirror what Game Master Sound Board's installer does on
        # ingestion — open the zip, find plugin.json, parse it, confirm
        # the declared entryDll exists alongside, AND confirm the
        # manifest's version matches the tag-derived version. Catches
        # packaging regressions before they reach paying customers.
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "No zip produced." }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $manifestEntry = $archive.Entries | Where-Object { $_.Name -eq 'plugin.json' } | Select-Object -First 1
            if (-not $manifestEntry) { throw "$($zip.Name): no plugin.json inside." }
            $reader = New-Object System.IO.StreamReader($manifestEntry.Open())
            $json = $reader.ReadToEnd() | ConvertFrom-Json
            $reader.Close()
            foreach ($field in 'publisher','id','entryDll') {
              if (-not $json.$field) { throw "$($zip.Name): plugin.json missing '$field'." }
            }
            $manifestFolder = Split-Path $manifestEntry.FullName -Parent
            $entryPath = "$manifestFolder/$($json.entryDll)"
            if (-not ($archive.Entries | Where-Object { $_.FullName -eq $entryPath })) {
              throw "$($zip.Name): manifest declares entryDll '$($json.entryDll)' but $entryPath is not in the zip."
            }
            if ($json.version -ne $env:EXPECTED_VERSION) {
              throw "$($zip.Name): manifest version '$($json.version)' does not match tag-derived version '$env:EXPECTED_VERSION'."
            }
            Write-Host "OK $($zip.Name) - $($json.publisher)/$($json.id) v$($json.version)"
          } finally {
            $archive.Dispose()
          }

      - name: Publish to itch.io (butler)
        # Paid plugin — published to itch.io, NOT as a public GitHub Release.
        # Requires:
        #   - secret   BUTLER_API_KEY  : an itch.io API key (repo or org secret)
        #   - variable ITCH_TARGET     : butler target "user/project:channel",
        #                                e.g. "dsand64/gmsb-codec-aac-windows:windows"
        # The zip from package.ps1 is exactly what the host's Plugin Manager
        # ingests; butler versions it per channel via --userversion.
        #
        # NOTE: this step runs on the windows-latest runner — both the
        # butler binary we download AND the shell we use must be Windows-
        # native. `shell: bash` selects the Git Bash that ships with
        # windows-latest (so `[ ... ]`, `curl`, `unzip` all work), and we
        # pull butler's windows-amd64 archive (NOT linux-amd64). Don't
        # change either without rechecking the other.
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
          USER_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ -z "$ITCH_TARGET" ]; then
            echo "::error::Repo variable ITCH_TARGET is not set (expected user/project:channel)."
            exit 1
          fi
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::Repo secret BUTLER_API_KEY is not set."
            exit 1
          fi
          curl -sL -o butler.zip https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler-bin
          ZIP="$(ls dist/*.zip | head -n1)"
          echo "Pushing $ZIP -> $ITCH_TARGET (userversion $USER_VERSION)"
          ./butler-bin/butler.exe push "$ZIP" "$ITCH_TARGET" --userversion "$USER_VERSION"
